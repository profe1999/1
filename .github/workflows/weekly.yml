name: Weekly fundamentals (smart-lab.ru)

on:
  schedule:
    - cron: "0 3 * * 1" # каждый понедельник в 03:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm run fetch-fundamentals
      - name: Закоммитить обновлённые фундаментальные данные
        run: |
          git config user.name "moex-pipeline-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/fundamentals.json data/review-queue-weekly.json
          git diff --cached --quiet || git commit -m "chore: еженедельное обновление fundamentals.json"
          git pull --rebase origin ${{ github.ref_name }}
          git push origin HEAD:${{ github.ref_name }}
